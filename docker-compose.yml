services:
  postgres:
    image: postgres:17-alpine
    container_name: tiquetera-postgres
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema # solo para desarrollo local
    ports:
      # 5433 en el host para no chocar con un PostgreSQL instalado localmente en el 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Esquema y seed: Postgres ejecuta db/init.sql al inicializar el volumen vacío (ADR-001).
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Por TCP (-h localhost): mientras corre init.sql, Postgres solo escucha por socket Unix,
      # así el contenedor no figura "healthy" hasta que el esquema está creado.
      test: ["CMD-SHELL", "pg_isready -h localhost -U cinema -d cinema"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
